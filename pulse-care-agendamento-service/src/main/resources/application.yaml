server:
  port: 3710

spring:
  application:
    name: agendamento-service

  datasource:
    url: ${AGENDAMENTO_DATASOURCE_URL:jdbc:postgresql://localhost:5432/agendamento_db}
    username: ${DB_USER:pulsecare}
    password: ${DB_PASSWORD:pulsecare}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

springdoc:
  swagger-ui:
    path: /swagger-ui.html
